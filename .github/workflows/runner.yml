name: Build Reaper Emporium Localization

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 1"
  push:
    tags:
      - "v*"

permissions: write-all

jobs:
  get-version:
    name: Get Version
    runs-on: ubuntu-22.04
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Select release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME}"
            RELEASE_TAG="${GITHUB_REF_NAME}"
            PRERELEASE="false"
          else
            RELEASE_VERSION="$(date -u '+%Y.%m.%d')"
            RELEASE_TAG="reaper.${RELEASE_VERSION}"
            PRERELEASE="true"
          fi

          echo "release_version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE}" >> "${GITHUB_OUTPUT}"

  validate-tools:
    name: Validate Tools
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: ReaperEmporiumLocalization.Tools/uv.lock

      - name: Install tool dependencies
        working-directory: ReaperEmporiumLocalization.Tools
        run: uv sync

      - name: Run tool tests
        working-directory: ReaperEmporiumLocalization.Tools
        run: uv run python -m unittest discover tests

  build-release:
    name: Build Integrated Release
    runs-on: windows-latest
    needs:
      - get-version
      - validate-tools
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: ReaperEmporiumLocalization.Tools/uv.lock

      - name: Use GitHub game folder props
        shell: pwsh
        run: Copy-Item GameFolder.github.props GameFolder.props -Force

      - name: Build plugins
        shell: pwsh
        run: dotnet build ReaperEmporiumLocalization.sln -c Release

      - name: Install tool dependencies
        working-directory: ReaperEmporiumLocalization.Tools
        run: uv sync

      - name: Download ParaTranz export
        working-directory: ReaperEmporiumLocalization.Tools
        env:
          PARATRANZ_TOKEN: ${{ secrets.PARATRANZ_TOKEN }}
          PARATRANZ_PROJECT_ID: ${{ secrets.PARATRANZ_PROJECT_ID }}
        run: uv run reaper-tools 下载包 --force --progress

      - name: Build localization package
        working-directory: ReaperEmporiumLocalization.Tools
        run: uv run reaper-tools 最终打包 --progress

      - name: Compose integrated release package
        id: compose
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "${{ needs.get-version.outputs.release_version }}"
          $releaseRoot = Join-Path $PWD "build\release"
          $staging = Join-Path $releaseRoot "ReaperEmporiumLocalization"
          $archive = Join-Path $releaseRoot "ReaperEmporiumLocalization-$version.zip"
          $gameRoot = Resolve-Path "ReaperEmporium.GameRoot"
          $localizationZip = Resolve-Path "ReaperEmporiumLocalization.Tools\build\package\ReaperEmporiumLocalization-localization.zip"

          if (Test-Path $staging) {
            Remove-Item -LiteralPath $staging -Recurse -Force
          }
          if (Test-Path $archive) {
            Remove-Item -LiteralPath $archive -Force
          }
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          Get-ChildItem -LiteralPath $gameRoot -Force |
            Where-Object { $_.Name -ne "死神商館RExEX_Data" } |
            ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination $staging -Recurse -Force
            }

          $cacheDir = Join-Path $staging "BepInEx\cache"
          if (Test-Path $cacheDir) {
            Remove-Item -LiteralPath $cacheDir -Recurse -Force
          }

          $bepInExLog = Join-Path $staging "BepInEx\LogOutput.log"
          if (Test-Path $bepInExLog) {
            Remove-Item -LiteralPath $bepInExLog -Force
          }

          Get-ChildItem -LiteralPath $staging -Recurse -Force -Filter "*.log" |
            Remove-Item -Force

          foreach ($runtimeDir in @("BepInEx\plugins", "BepInEx\patchers")) {
            $runtimePath = Join-Path $staging $runtimeDir
            if (Test-Path $runtimePath) {
              Get-ChildItem -LiteralPath $runtimePath -Recurse -Force -File |
                Where-Object { $_.Extension -ine ".dll" } |
                Remove-Item -Force
            }
          }

          $localizationDir = Join-Path $staging "localization"
          New-Item -ItemType Directory -Force -Path $localizationDir | Out-Null
          foreach ($generatedSubdir in @("database", "dll_strings")) {
            $generatedPath = Join-Path $localizationDir $generatedSubdir
            if (Test-Path $generatedPath) {
              Remove-Item -LiteralPath $generatedPath -Recurse -Force
            }
          }

          Expand-Archive -LiteralPath $localizationZip -DestinationPath $staging -Force
          Copy-Item -LiteralPath "DISCLAIMER.txt" -Destination (Join-Path $staging "DISCLAIMER.txt") -Force
          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath $archive -Force

          "archive=$archive" >> $env:GITHUB_OUTPUT
          "archive_name=$(Split-Path $archive -Leaf)" >> $env:GITHUB_OUTPUT

      - name: Validate integrated release package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $archive = "${{ steps.compose.outputs.archive }}"
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $names = $zip.Entries | ForEach-Object { $_.FullName.Replace("\", "/") }

            foreach ($required in @("BepInEx/", "localization/", "localization/database/", "localization/dll_strings/", "localization/fonts/")) {
              if (-not ($names | Where-Object { $_.StartsWith($required) })) {
                throw "Missing required directory in release package: $required"
              }
            }

            foreach ($required in @(".doorstop_version", "doorstop_config.ini", "winhttp.dll", "changelog.txt", "DISCLAIMER.txt")) {
              if (-not ($names -contains $required)) {
                throw "Missing required file in release package: $required"
              }
            }

            foreach ($forbidden in @("死神商館RExEX_Data/", "BepInEx/cache/")) {
              if ($names | Where-Object { $_.StartsWith($forbidden) }) {
                throw "Forbidden path was packaged: $forbidden"
              }
            }

            if ($names | Where-Object { $_.EndsWith(".log", [System.StringComparison]::OrdinalIgnoreCase) }) {
              throw "Log files must not be included in the release package."
            }

            $runtimeFiles = $names |
              Where-Object {
                ($_.StartsWith("BepInEx/plugins/") -or $_.StartsWith("BepInEx/patchers/")) -and
                -not $_.EndsWith("/")
              }
            $nonDllRuntimeFiles = $runtimeFiles |
              Where-Object { -not $_.EndsWith(".dll", [System.StringComparison]::OrdinalIgnoreCase) }
            if ($nonDllRuntimeFiles) {
              throw "Release package plugin/patcher directories must contain DLL files only: $($nonDllRuntimeFiles -join ', ')"
            }
          }
          finally {
            $zip.Dispose()
          }

      - name: Upload integrated release artifact
        uses: actions/upload-artifact@v7
        with:
          name: integrated-release
          path: ${{ steps.compose.outputs.archive }}
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - get-version
      - build-release
    steps:
      - name: Download integrated release artifact
        uses: actions/download-artifact@v8
        with:
          name: integrated-release
          path: release-artifacts

      - name: Publish prerelease
        if: needs.get-version.outputs.prerelease == 'true'
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ needs.get-version.outputs.release_tag }}
          commit: ${{ github.sha }}
          name: Pre-Release ${{ needs.get-version.outputs.release_version }}
          body: |
            自动构建的整合预发布包，可直接解压到游戏根目录。
          artifacts: release-artifacts/*.zip
          prerelease: true
          allowUpdates: true
          removeArtifacts: true

      - name: Publish tagged release
        if: needs.get-version.outputs.prerelease == 'false'
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ needs.get-version.outputs.release_tag }}
          name: Release ${{ needs.get-version.outputs.release_version }}
          body: |
            整合发布包，可直接解压到游戏根目录。
          artifacts: release-artifacts/*.zip
          prerelease: false
          allowUpdates: true
          removeArtifacts: true
